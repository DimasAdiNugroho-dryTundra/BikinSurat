<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Royal Blue to Deep Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Top Border Highlight -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </linearGradient>

    <!-- Paper Sheet Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Paper Fold Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Pen Body Gradient -->
    <linearGradient id="penBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Pen Tip Gradient -->
    <linearGradient id="penTipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Ink Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Soft Drop Shadow for Document -->
    <filter id="docShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#090d16" flood-opacity="0.45" />
    </filter>

    <!-- Pen Shadow -->
    <filter id="penShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="4" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGlow)" stroke-width="3" />

  <!-- Document Sheet with Folded Corner -->
  <g filter="url(#docShadow)">
    <!-- Document Body -->
    <path d="M 140 100 
             L 285 100 
             L 370 185 
             L 370 400 
             A 18 18 0 0 1 352 418 
             L 140 418 
             A 18 18 0 0 1 122 400 
             L 122 118 
             A 18 18 0 0 1 140 100 Z" 
          fill="url(#paperGrad)" />

    <!-- Folded Corner Flap -->
    <path d="M 285 100 
             L 285 170 
             A 15 15 0 0 0 300 185 
             L 370 185 Z" 
          fill="url(#foldGrad)" />

    <!-- Subtle Fold Shadow under corner -->
    <path d="M 285 185 L 300 185 L 285 170 Z" fill="#64748b" opacity="0.3" />

    <!-- Official Document Lines -->
    <!-- Title Line -->
    <rect x="165" y="152" width="95" height="14" rx="7" fill="#3b82f6" opacity="0.85" />

    <!-- Body Paragraph Lines -->
    <rect x="165" y="215" width="165" height="9" rx="4.5" fill="#94a3b8" opacity="0.75" />
    <rect x="165" y="243" width="145" height="9" rx="4.5" fill="#94a3b8" opacity="0.65" />
    <rect x="165" y="271" width="155" height="9" rx="4.5" fill="#94a3b8" opacity="0.65" />
    <rect x="165" y="299" width="115" height="9" rx="4.5" fill="#94a3b8" opacity="0.55" />
  </g>

  <!-- Dynamic Signature Swoosh (Created Letter) -->
  <path d="M 165 372 
           C 200 360, 240 380, 280 366 
           C 310 355, 335 348, 355 352" 
        fill="none" 
        stroke="url(#swooshGrad)" 
        stroke-width="7" 
        stroke-linecap="round" />

  <!-- Modern Pen / Stylus Nib Signer -->
  <g filter="url(#penShadow)" transform="rotate(-38, 360, 310)">
    <!-- Pen Barrel -->
    <rect x="338" y="110" width="34" height="175" rx="12" fill="url(#penBodyGrad)" />
    <!-- Metallic Ring -->
    <rect x="338" y="275" width="34" height="10" fill="#38bdf8" />
    <!-- Pen Cone -->
    <path d="M 338 285 L 347 335 L 363 335 L 372 285 Z" fill="#1e293b" />
    <!-- Nib Tip -->
    <path d="M 347 335 L 355 358 L 363 335 Z" fill="url(#penTipGrad)" />
    <!-- Nib Slit -->
    <line x1="355" y1="337" x2="355" y2="352" stroke="#0f172a" stroke-width="1.5" />
    <!-- Pen Clip -->
    <rect x="350" y="125" width="10" height="80" rx="4" fill="#93c5fd" opacity="0.9" />
  </g>

  <!-- Glowing Accent Sparkle / Stamp of Quality -->
  <circle cx="370" cy="185" r="4" fill="#38bdf8" opacity="0.8" />
</svg>

